<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <title>Tiko.az — Test sistemi</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; background: #0F0F1A; color: #F4F4FA; padding: 32px; max-width: 900px; margin: 0 auto; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #A8A8C0; margin-bottom: 24px; }
    #summary { font-family: "JetBrains Mono", Consolas, monospace; padding: 12px 16px; border-radius: 10px; background: #16162B; margin-bottom: 16px; font-weight: 600; }
    #summary.ok { color: #84CC16; }
    #summary.fail { color: #F43F5E; }
    ol { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .test { padding: 10px 14px; background: #16162B; border-radius: 8px; font-size: 14px; }
    .test.fail { border: 1px solid #F43F5E; }
    .pill { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 999px; margin-right: 8px; font-weight: 700; }
    .pill.ok { background: #84CC1622; color: #84CC16; }
    .pill.fail { background: #F43F5E22; color: #F43F5E; }
    pre { background: #0B0B12; padding: 8px 12px; border-radius: 6px; margin-top: 6px; color: #A8A8C0; font-size: 12px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>🧪 Tiko.az — daxili test sistemi</h1>
  <p>Brauzer üçün sadə test runner — heç bir node və ya build alət lazım deyil.</p>
  <div id="summary">İcra olunur…</div>
  <ol id="results"></ol>
  <script type="module" src="tests.js"></script>
</body>
</html>
